    <clipPath id="outline">
      <path d="M0 1.5 2 0 4 1.5 6 0 8 1.5 10 0 12 1.5 14 0 16 1.5V20.5L14 22 12 20.5 10 22 8 20.5 6 22 4 20.5 2 22 0 20.5Z" />
